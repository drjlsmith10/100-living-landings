<!doctype html><html><head><meta charset="utf-8"><title>Good Signal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{background:#0c1210;color:#e4efe6;font-family:'Space Grotesk',sans-serif;height:100vh;overflow:hidden;display:flex}
.tower-viz{flex:1.1;position:relative;background:radial-gradient(circle at 50% 30%,#14261e,#0a120d);display:flex;align-items:center;justify-content:center}
.tower-t{position:relative;width:min(36vw,200px);height:min(60vh,340px)}
.mast{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:10px;height:100%;background:#2a3a30;border-radius:5px}
.dish{position:absolute;width:56px;height:56px;background:#3d5246;border-radius:50% 50% 0 0;top:8%;left:50%;transform:translateX(-50%)}
.wave-ring{position:absolute;top:14%;left:50%;border:2.5px solid #7ce38b;width:40px;height:40px;margin-left:-20px;border-radius:50%;opacity:0;animation:bcastG 3s ease-out infinite}
.wr2{animation-delay:1s}.wr3{animation-delay:2s}
@keyframes bcastG{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(5)}}
@media(max-width:800px){.tower-viz{display:none}}
.copy{width:min(54%,600px);padding:11vh max(6vw,50px);display:flex;flex-direction:column;justify-content:center;background:#0c1210;z-index:1}
.kick{font-size:11px;letter-spacing:.42em;color:#7ce38b;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:300;font-size:clamp(2.8rem,5vw,4.9rem);line-height:1.05;color:#f0f7ec}
h1 b{color:#7ce38b;font-weight:700}
p{margin-top:2em;font-weight:300;font-size:15px;line-height:2.05;color:#93ad9a;max-width:420px}
.four-wk{display:flex;gap:12px;margin-top:2.6em;font-size:12px;flex-wrap:wrap}
.w{background:#15241c;padding:12px 18px;border-radius:8px;color:#b8d4c2}
.go{margin-top:2.8em;width:fit-content;background:#7ce38b;color:#0c1210;font-weight:700;padding:16px 44px;text-decoration:none;font-size:13px;border-radius:999px;transition:.25s}
.go:hover{transform:translateY(-3px);box-shadow:0 14px 44px #7ce38b44}
</style></head><body>
<div class="tower-viz"><div class="tower-t"><div class="mast"></div><div class="dish"></div><div class="wave-ring"></div><div class="wave-ring wr2"></div><div class="wave-ring wr3"></div></div></div>
<div class="copy">
<div class="kick">Good Signal · a sharper strategy in four weeks</div>
<h1>Cut through the static.<br><b>Find the frequency.</b></h1>
<p>A four-week engagement that ends with one written strategy your whole team can repeat from memory — built on customer evidence, not boardroom vibes.</p>
<div class="four-wk"><span class="w">wk 1 — listen</span><span class="w">wk 2-3 — test</span><span class="w">wk 4 — transmit</span></div>
<a class="go" href="#">Tune in →</a></div></body></html>
