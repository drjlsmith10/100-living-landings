<!doctype html><html><head><meta charset="utf-8"><title>Gather</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Nunito:wght@300;600&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{background:#2b1e14;color:#f3e6d2;font-family:Nunito,sans-serif;height:100vh;overflow:hidden;display:flex}
.table{flex:1.15;position:relative;background:linear-gradient(#33241a,#241811);display:flex;align-items:center;justify-content:center}
.wood{width:min(56vw,420px);aspect-ratio:1.7;background:repeating-linear-gradient(90deg,#5c3a22 0 34px,#4a2e18 34px 70px);border-radius:16px;box-shadow:0 40px 80px #00000088,inset 0 -12px 24px #00000055,0 0 60px #ffb37c14;transform:rotateX(28deg)}
.candle{position:absolute;top:26%;left:calc(50% - 9px);width:18px;height:52px;background:linear-gradient(#efe2c8,#d9c8a4);border-radius:4px}
.flame{position:absolute;top:-22px;left:2px;width:13px;height:24px;background:radial-gradient(circle at 50% 78%,#fff3c2,#ffab4a 62%,transparent);border-radius:50% 50% 50% 50%/64% 64% 36% 36%;animation:flickG .65s ease-in-out infinite alternate}
@keyframes flickG{to{transform:scaleY(1.32) rotate(-4deg)}}
.copy{width:min(48%,560px);padding:11vh max(6vw,50px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:'Amatic SC';font-size:19px;letter-spacing:.35em;color:#e0a04a;text-transform:uppercase;margin-bottom:.6em}
h1{font-family:'Amatic SC';font-weight:700;font-size:clamp(3.4rem,6vw,5.6rem);line-height:.95;margin-bottom:.25em}
p{margin-top:1.6em;font-weight:300;font-size:15px;line-height:2;color:#cdb896;max-width:400px}
.menu{display:inline-block;margin-top:1em;color:#e0a04a;text-decoration:none;font-style:italic;font-size:14px;border-bottom:1px dashed #e0a04a;padding-bottom:3px}
.book{margin-top:2.8em;width:fit-content;background:#e0a04a;color:#2b1e14;font-weight:700;padding:17px 44px;text-decoration:none;font-size:13px;border-radius:999px;transition:.25s}
.book:hover{background:#ffd7a0;transform:translateY(-3px)}
</style></head><body>
<div class="table"><div class="wood"></div><div class="candle"><div class="flame"></div></div></div>
<div class="copy">
<div class="kick">Supper club · by the season</div>
<h1>Make your next dinner<br>one they retell.</h1>
<p>Gather plans and runs intimate dinners for eight — menu, wine, table, and a conversation starter that isn't "so what do you do?"</p>
<a class="menu" href="#">peek at this season's menus →</a><br>
<a class="book" href="#">Book a table for eight</a></div></body></html>
