<!doctype html><html><head><meta charset="utf-8"><title>Mile Marker</title>
<style>*{margin:0;box-sizing:border-box}body{height:100vh;overflow:hidden;background:linear-gradient(#fdf8ef,#f4e9d6);color:#2e2a22;font-family:sans-serif;position:relative}
.route-svg{position:absolute;inset:0;width:100%;height:100%}
.copy{position:relative;z-index:1;padding:14vh 8vw 0;max-width:560px}
.kick{font-size:11px;letter-spacing:.42em;color:#d96c2c;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:300;font-size:clamp(2.7rem,5.2vw,4.7rem);line-height:1.05;color:#26221a}
h1 b{color:#d96c2c}
p{margin-top:2em;max-width:400px;font-weight:300;font-size:14.5px;line-height:2;color:#6e675a}
.miles{display:flex;gap:34px;margin-top:3em;font-family:Georgia,serif}
.m b{font-size:30px;display:block;color:#d96c2c}
.m span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a8070}
.go{margin-top:3em;display:inline-block;background:#2e2a22;color:#f4e9d6;padding:17px 44px;border-radius:999px;text-decoration:none;font-size:13px;letter-spacing:.14em;transition:.25s}
.go:hover{background:#d96c2c}
.pin{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;background:#d96c2c;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 4px 12px #00000033;animation:dropP .6s cubic-bezier(.2,.9,.3,1.4) both}
.p2{animation-delay:.4s}.p3{animation-delay:.8s}.p4{animation-delay:1.2s}
@keyframes dropP{from{transform:rotate(-45deg) translateY(-60px) scale(1.4);opacity:0}}
@media(max-width:700px){.pin,.route-svg{display:none}}
</style></head><body>
<svg class="route-svg" viewBox="0 0 1200 800" preserveAspectRatio="none"><path id="trail" d="M-50,650 C200,500 300,700 480,520 S750,300 900,420 S1150,250 1260,180" fill="none" stroke="#d96c2c55" stroke-width="4" stroke-dasharray="14 12"/></svg>
<div class="pin" style="top:58%;left:16%"></div><div class="pin p2" style="top:38%;left:38%"></div><div class="pin p3" style="top:52%;left:62%"></div><div class="pin p4" style="top:24%;left:84%"></div>
<div class="copy">
<div class="kick">The running plan that adapts to you</div>
<h1>Every run starts<br>from <b>where you are.</b></h1>
<p>Literally. Mile Marker reads your last 30 days — sleep, load, mood — and writes today's run this morning, not twelve weeks ago.</p>
<div class="miles"><div class="m"><b>12k</b><span>runners</span></div><div class="m"><b>94%</b><span>still going at month 3</span></div><div class="m"><b>0</b><span>guilt notifications</span></div></div>
<a class="go" href="#">MAP MY FIRST WEEK →</a></div></body></html>
