<!doctype html><html><head><meta charset="utf-8"><title>Compass</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{background:#faf8f3;color:#2b2820;font-family:Inter,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 5vw}
.wrap{display:grid;grid-template-columns:auto 1fr;gap:min(7vw,90px);align-items:center;max-width:1050px}
@media(max-width:840px){.wrap{grid-template-columns:1fr;text-align:center}.dial-wrap{margin:0 auto}.opts{justify-content:center}}
.dial-wrap{position:relative;width:min(70vw,330px);aspect-ratio:1}
.dial{width:100%;height:100%;border-radius:50%;border:1.5px solid #c9c2b0;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(#fff,#f4f0e4)}
.tick{position:absolute;width:2px;height:12px;background:#b8b09a;top:10px;left:calc(50% - 1px);transform-origin:50% calc(min(35vw,165px) - 10px)}
.needle{position:absolute;top:50%;left:50%;width:4px;height:42%;background:linear-gradient(#d96c2c,#d96c2c00);transform-origin:top;border-radius:3px;margin-left:-2px;animation:seekC 5s cubic-bezier(.65,0,.25,1) infinite}
.needle::after{content:"";position:absolute;top:-8px;left:-6px;width:16px;height:16px;background:#d96c2c;border-radius:50%}
@keyframes seekC{0%,18%{transform:rotate(38deg)}38%{transform:rotate(-52deg)}58%{transform:rotate(8deg)}78%,92%{transform:rotate(0)}100%{transform:rotate(38deg)}}
.copy h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(2.8rem,4.8vw,4.6rem);line-height:1.06;margin:.3em 0}
.kick{font-size:11px;letter-spacing:.42em;color:#d96c2c;text-transform:uppercase}
p{max-width:420px;font-weight:300;font-size:15px;line-height:2;color:#75705f}
.opts{display:flex;gap:12px;margin-top:2.6em;flex-wrap:wrap}
.o{border:1.5px solid #d9d3c2;padding:12px 24px;border-radius:999px;font-size:13px;cursor:pointer;transition:.22s;background:#fff}
.o:hover,.o.sel{border-color:#d96c2c;color:#d96c2c;background:#fdf3ea}
.ask{margin-top:2.6em;display:inline-block;background:#2b2820;color:#faf8f3;padding:17px 44px;border-radius:999px;text-decoration:none;font-size:13px;transition:.25s}
.ask:hover{background:#d96c2c}
</style></head><body>
<div class="wrap">
<div class="dial-wrap"><div class="dial" id="dial"></div><div class="needle"></div></div>
<div class="copy">
<div class="kick">A personal dashboard for decisions</div>
<h1>What matters now,<br>pointed out daily.</h1>
<p>Compass surfaces the three decisions closest to their deadline — across work, money, and life — and shows what each is waiting on. Nothing else.</p>
<div class="opts"><span class="o sel">work</span><span class="o">money</span><span class="o">life</span></div><br>
<a class="ask" href="#">POINT ME →</a></div></div>
<script>const dial=document.getElementById('dial');for(let i=0;i<36;i++){const t=document.createElement('div');t.className='tick';t.style.transform=`rotate(${i*10}deg)`;t.style.height=i%9===0?'20px':'10px';dial.appendChild(t)}</script></body></html>
