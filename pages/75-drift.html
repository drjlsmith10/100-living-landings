<!doctype html><html><head><meta charset="utf-8"><title>Drift</title>
<style>*{margin:0;box-sizing:border-box}body{background:linear-gradient(#1a2340,#31395e 55%,#4a4a72);color:#e8eaf2;font-family:sans-serif;height:100vh;overflow:hidden;position:relative}
.stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.5;animation:twd 6s infinite}
@keyframes twd{50%{opacity:.05}}
.balloon-d{position:absolute;top:16%;right:16%;width:min(24vw,150px);height:min(30vw,190px);border-radius:50% 50% 46% 46%/56% 56% 44% 44%;background:radial-gradient(circle at 34% 28%,#ff9d7a,#e05c48 62%,#a83a52);box-shadow:inset -14px -18px 30px #00000033;animation:hoverB 8s ease-in-out infinite alternate}
.balloon-d::after{content:"";position:absolute;bottom:-22px;left:50%;width:36px;height:26px;margin-left:-18px;background:#6b4a2e;border-radius:5px}
@keyframes hoverB{from{transform:translate(0,0) rotate(-2deg)}to{transform:translate(-20px,14px) rotate(2.5deg)}}
.copy{position:absolute;left:7vw;top:50%;transform:translateY(-50%);max-width:500px;z-index:2}
.kick{font-size:11px;letter-spacing:.42em;color:#ffb37c;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:250;font-size:clamp(2.8rem,5.4vw,5rem);line-height:1.06;color:#f5f0e6}
h1 em{color:#ffb37c}
p{margin-top:2em;font-weight:300;font-size:15px;line-height:2.05;color:#b0b4cc;max-width:400px}
.go{margin-top:2.8em;display:inline-block;background:#ffb37c;color:#1a2340;font-weight:700;padding:17px 46px;text-decoration:none;font-size:13px;border-radius:999px;transition:.25s}
.go:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 16px 44px #ffb37c44}
</style></head><body>
<div class="stars"><i style="top:10%;left:10%"></i><i style="top:24%;left:80%;animation-delay:1.2s"></i><i style="top:60%;left:88%;animation-delay:2s"></i><i style="top:76%;left:12%;animation-delay:.7s"></i><i style="top:40%;left:55%;animation-delay:2.6s"></i></div>
<div class="balloon-d"></div>
<div class="copy">
<div class="kick">Drift · a planning tool for a life, not a to-do list</div>
<h1>Build a life around<br><em>what matters,</em><br>not what's urgent.</h1>
<p>Drift starts with the five things you'd regret not doing — then quietly arranges your calendar until your weeks look like that person's life.</p>
<a class="go" href="#">Name your five →</a></div></body></html>
