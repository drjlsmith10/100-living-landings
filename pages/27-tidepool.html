<!doctype html><html><head><meta charset="utf-8"><title>Tidepool</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{height:100vh;overflow:hidden;background:#0f2e33;color:#e6f4f1;font-family:Quicksand,sans-serif;position:relative}
.pool{position:absolute;bottom:-30vh;left:-20vw;width:140vw;height:70vh;border-radius:50%;background:radial-gradient(#1b4a52,#123137 70%);animation:tideT 9s ease-in-out infinite alternate}
@keyframes tideT{to{transform:translateY(-5vh)}}
.foam{position:absolute;bottom:-32vh;left:-20vw;width:140vw;height:70vh;border-radius:50%;border-top:3px solid #a8dcd244;animation:tideT 11s ease-in-out infinite alternate-reverse}
.shell{position:absolute;bottom:16vh;left:14vw;width:54px;height:54px;background:#e8b48c;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:inset -8px -8px 0 #c98c62;animation:settleS 1.4s cubic-bezier(.2,.9,.3,1.3) both .3s}
.star{position:absolute;bottom:12vh;right:16vw;width:58px;height:58px;background:#e07b6a;clip-path:polygon(50% 0,63% 36%,100% 39%,72% 61%,80% 100%,50% 77%,20% 100%,28% 61%,0 39%,37% 36%);animation:creep 12s ease-in-out infinite alternate}
@keyframes creep{to{transform:translateX(-40px) rotate(18deg)}}
.copy{position:absolute;top:14vh;left:8vw;max-width:520px;z-index:2}
.kick{font-size:11px;letter-spacing:.45em;color:#8fd4c8;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:300;font-size:clamp(2.8rem,5.6vw,5rem);line-height:1.06}
h1 em{color:#8fd4c8}
p{margin-top:2em;max-width:400px;font-weight:300;font-size:14.5px;line-height:2;color:#b8d4cd}
.shop{margin-top:2.6em;display:inline-flex;gap:26px;font-size:13px;color:#8fd4c8}
.shop span{cursor:pointer;padding-bottom:6px;border-bottom:2px solid transparent;transition:.25s}
.shop span:hover{border-color:#8fd4c8}
</style></head><body>
<div class="pool"></div><div class="foam"></div><div class="shell"></div><div class="star"></div>
<div class="copy">
<div class="kick">Objects for a quieter home</div>
<h1>Things that belong<br>at <em>low tide.</em></h1>
<p>Ceramics, linens, and small wooden objects in sea-worn colors — chosen for how a room feels after everyone's gone to bed.</p>
<div class="shop"><span>ceramics →</span><span>linens →</span><span>wood →</span></div></div></body></html>
