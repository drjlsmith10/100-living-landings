<!doctype html><html><head><meta charset="utf-8"><title>Studio 9</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{background:#f2ede4;color:#26231c;font-family:Inter,sans-serif;height:100vh;overflow:hidden;display:flex}
.blocks{flex:1.1;position:relative;display:flex;align-items:center;justify-content:center;background:#e8e0d0}
.stack9{display:flex;flex-direction:column-reverse;gap:10px;width:min(40vw,240px)}
.blk{height:52px;border-radius:10px;animation:dropB .6s cubic-bezier(.2,.9,.3,1.3) both;transition:.25s;cursor:pointer}
.blk:hover{transform:translateX(-14px) rotate(-2deg)}
.bk1{background:#c9622e;width:100%;animation-delay:.15s}.bk2{background:#33302a;width:82%;margin-left:auto;animation-delay:.3s}.bk3{background:#5a7a99;width:90%;animation-delay:.45s}.bk4{background:#b5852f;width:74%;margin-left:auto;animation-delay:.6s}.bk5{background:#7a9a6e;width:88%;animation-delay:.75s}
@keyframes dropB{from{transform:translateY(-120px) rotate(8deg);opacity:0}}
@media(max-width:780px){.blocks{display:none}}
.copy{width:min(54%,600px);padding:11vh max(6vw,50px);display:flex;flex-direction:column;justify-content:center}
.kick{font-family:Syne;font-weight:800;font-size:11px;letter-spacing:.42em;color:#c9622e;text-transform:uppercase;margin-bottom:2.4em}
h1{font-family:Syne;font-weight:800;font-size:clamp(2.8rem,5vw,4.9rem);line-height:1.02;letter-spacing:-.02em;color:#211d17}
h1 em{color:#c9622e;font-style:normal}
p{margin-top:2em;font-weight:300;font-size:14.5px;line-height:2.05;color:#6e685a;max-width:400px}
.go-row{margin-top:2.8em;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.go{background:#26231c;color:#f2ede4;padding:16px 42px;text-decoration:none;font-size:13px;border-radius:999px;font-weight:600;transition:.25s}
.go:hover{background:#c9622e;transform:translateY(-3px)}
.note-s{font-size:12px;color:#8a8474}
</style></head><body>
<div class="blocks"><div class="stack9"><div class="blk bk1"></div><div class="blk bk2"></div><div class="blk bk3"></div><div class="blk bk4"></div><div class="blk bk5"></div></div></div>
<div class="copy">
<div class="kick">Studio 9 · design support, exactly when needed</div>
<h1>A design team<br>on <em>tap,</em><br>not on payroll.</h1>
<p>One flat monthly subscription. Unlimited requests, one at a time, delivered in 48 hours. Pause anytime — your designers don't notice, your accountant will.</p>
<div class="go-row"><a class="go" href="#">See the plans →</a><span class="note-s">from $2,495/mo · cancel whenever</span></div></div></body></html>
