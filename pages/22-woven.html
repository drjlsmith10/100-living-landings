<!doctype html><html><head><meta charset="utf-8"><title>Woven</title>
<style>*{margin:0;box-sizing:border-box}body{background:#f5efe6;color:#43392e;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 6vw;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#8a7c68}
.hero{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:80vh}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.weave{position:relative;background:#ece2d2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.grid-w{position:absolute;inset:-40px;background-image:repeating-linear-gradient(0deg,#d9cbb4 0 26px,transparent 26px 52px),repeating-linear-gradient(90deg,#cbb99e 0 26px,transparent 26px 52px);animation:shift 14s linear infinite}
@keyframes shift{to{transform:translate(52px,52px)}}
.swatch-card{position:relative;width:min(64vw,300px);aspect-ratio:.8;border-radius:14px;overflow:hidden;box-shadow:0 30px 70px #43392e33;transition:transform .4s;z-index:1}
.swatch-card:hover{transform:rotate(-2deg) scale(1.03)}
.swatch-card img{width:100%;height:100%;object-fit:cover}
.copy{display:flex;flex-direction:column;justify-content:center;padding:10vh 7vw}
.kick{font-size:11px;letter-spacing:.42em;color:#b0682f;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:250;font-size:clamp(2.7rem,4.8vw,4.6rem);line-height:1.05;letter-spacing:-.02em}
h1 em{color:#b0682f}
p{margin-top:2em;font-weight:300;font-size:14.5px;line-height:2;color:#7a6e5c;max-width:420px}
.colors{display:flex;gap:12px;margin-top:2.4em}
.c{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px #00000022;cursor:pointer;transition:.25s}
.c:hover{transform:scale(1.18)}
.buyrow{display:flex;align-items:center;gap:22px;margin-top:3em;flex-wrap:wrap}
.price{font-size:28px;font-family:Georgia,serif}
.buy{background:#43392e;color:#f5efe6;padding:16px 40px;border-radius:999px;text-decoration:none;font-size:13px;letter-spacing:.15em;transition:.25s}
.buy:hover{background:#b0682f}
</style></head><body>
<header><span>WOVEN</span><span>TEXTILES · THOUGHT THROUGH</span></header>
<div class="hero">
<div class="weave"><div class="grid-w"></div><div class="swatch-card"><img src="https://picsum.photos/seed/weave4/600/750" alt=""></div></div>
<div class="copy">
<div class="kick">The everyday throw · batch no. 11</div>
<h1>Cotton that gets<br>softer every <em>wash.</em></h1>
<p>Loomed in small runs from unbleached organic cotton, then pre-washed seven times so it arrives already broken in — like it's been yours for years.</p>
<div class="colors"><div class="c" style="background:#d9cbb4"></div><div class="c" style="background:#8a9a7b"></div><div class="c" style="background:#b0682f"></div><div class="c" style="background:#5d6b7a"></div></div>
<div class="buyrow"><span class="price">$96</span><a class="buy" href="#">ADD TO BASKET</a></div></div></div></body></html>
