<!doctype html><html><head><meta charset="utf-8"><title>Lumen House</title>
<style>*{margin:0;box-sizing:border-box}body{height:100vh;overflow:hidden;background:#0d1420;color:#e9eef7;font-family:Georgia,serif;position:relative}
.glow{position:absolute;top:-20%;right:-10%;width:70vw;height:70vw;background:radial-gradient(#2c4a6e,transparent 65%);animation:breathe 8s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.15)}}
.win{position:absolute;border-radius:3px;background:#ffd98a;box-shadow:0 0 24px 4px #ffd98a55;animation:flicker 5s ease-in-out infinite}
@keyframes flicker{92%{opacity:1}94%{opacity:.4}96%{opacity:1}}
.w1{top:18%;left:12%;width:26px;height:40px}.w2{top:18%;left:calc(12% + 44px);width:26px;height:40px;animation-delay:1.2s}.w3{bottom:30%;right:14%;width:22px;height:34px;animation-delay:2.4s}
.copy{position:absolute;left:8vw;bottom:16vh;max-width:480px;z-index:2}
small{letter-spacing:.45em;font-size:11px;color:#ffd98a;text-transform:uppercase}
h1{font-weight:400;font-size:clamp(2.8rem,6.5vw,5.4rem);line-height:1.08;margin:.4em 0 .5em;font-style:italic}
p{font-family:sans-serif;font-weight:300;font-size:14px;line-height:1.95;color:#b8c4d8;max-width:380px}
.book{margin-top:2.6em;display:inline-block;border:1px solid #ffd98a88;color:#ffd98a;padding:14px 34px;border-radius:2px;text-decoration:none;font-size:12px;letter-spacing:.3em;transition:.35s;font-family:sans-serif}
.book:hover{background:#ffd98a;color:#0d1420}
.price{position:absolute;right:8vw;bottom:16vh;text-align:right;z-index:2}
.price b{font-size:42px;font-weight:400}
.price span{display:block;font-size:11px;letter-spacing:.25em;color:#8493ab;margin-top:8px;font-family:sans-serif}
</style></head><body>
<div class="glow"></div>
<div class="win w1"></div><div class="win w2"></div><div class="win w3"></div>
<div class="copy"><small>A stay to remember</small><h1>Wake slowly.<br>The city can wait.</h1><p>Lumen House is a nine-room townhouse where breakfast is candlelit, phones sleep in drawers, and checkout means "whenever." Two nights minimum, for good reason.</p><a class="book" href="#">CHECK AVAILABILITY</a></div>
<div class="price"><b>$240</b><span>PER NIGHT · INCL. BREAKFAST</span></div></body></html>
