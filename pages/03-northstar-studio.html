<!doctype html><html><head><meta charset="utf-8"><title>Northstar Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Space+Mono&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{background:#efeae0;color:#171512;min-height:100vh;font-family:'Space Mono',monospace;overflow-x:hidden}
nav{display:flex;justify-content:space-between;padding:28px 6vw;font-size:12px;letter-spacing:.2em}
.hero{text-align:center;padding:12vh 6vw 8vh;position:relative}
h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(3.4rem,10vw,9rem);line-height:.95}
h1 span{display:inline-block;animation:lift 1s cubic-bezier(.2,.9,.2,1) both}
h1 span:nth-child(2){animation-delay:.08s}h1 span:nth-child(3){animation-delay:.16s}h1 span:nth-child(4){animation-delay:.24s}
@keyframes lift{from{transform:translateY(60px);opacity:0}}
.rule{width:0;height:2px;background:#171512;margin:5vh auto 0;animation:grow 1.4s .5s ease forwards}
@keyframes grow{to{width:70vw}}
.sub{max-width:430px;margin:6vh auto 0;font-size:13px;line-height:2}
.works{display:flex;justify-content:center;gap:2px;margin:9vh 0 0;flex-wrap:wrap}
.w{width:180px;height:240px;position:relative;overflow:hidden;cursor:pointer}
.w img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:.5s}
.w:hover img{filter:none;transform:scale(1.06)}
.w b{position:absolute;bottom:10px;left:12px;font-size:10px;letter-spacing:.2em;color:#fff;mix-blend-mode:difference}
footer{padding:8vh 6vw 10vh;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em}
footer a{color:inherit}
.star8{position:absolute;top:8vh;right:12vw;width:54px;height:54px;background:#c8502e;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:rot 9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style></head><body>
<nav><span>NORTHSTAR*</span><span>EST. 2019 — PORTLAND</span></nav>
<div class="hero"><div class="star8"></div><h1><span>Brands</span> <span>with</span> <span>a</span> <span>compass.</span></h1><div class="rule"></div><p class="sub">A brand strategy studio for founders who refuse beige. We find the true north of your company and point everything at it.</p></div>
<div class="works"><div class="w"><img src="https://picsum.photos/seed/ns1/360/480" alt=""><b>FERN & CO</b></div><div class="w"><img src="https://picsum.photos/seed/ns2/360/480" alt=""><b>KILN</b></div><div class="w"><img src="https://picsum.photos/seed/ns3/360/480" alt=""><b>HALCYON</b></div><div class="w"><img src="https://picsum.photos/seed/ns4/360/480" alt=""><b>MOTH</b></div></div>
<footer><span>© NORTHSTAR STUDIO</span><a href="#">START A PROJECT ↗</a></footer></body></html>
