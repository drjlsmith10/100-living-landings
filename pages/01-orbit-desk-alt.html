<!doctype html><html><head><meta charset="utf-8"><title>Orbit Desk — Focus OS</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{background:#07080d;color:#e8ecf8;font-family:Inter,sans-serif;height:100vh;overflow:hidden;position:relative}
.planet{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 30%,#5a6cff,#232a66 68%);box-shadow:inset -20px -14px 40px #00000088,0 0 60px #5a6cff22;top:50%;right:12vw;transform:translateY(-50%);width:min(30vw,260px);height:min(30vw,260px);animation:hoverP 7s ease-in-out infinite alternate}
@keyframes hoverP{to{transform:translateY(calc(-50% + 18px))}}
.moon-m{position:absolute;width:26px;height:26px;background:#c9d2ff;border-radius:50%;top:50%;right:calc(12vw + min(15vw,130px) - 13px);margin-top:-13px;transform-origin:calc(min(15vw,130px) + 13px) 13px;animation:orbitM 9s linear infinite}
@keyframes orbitM{to{transform:rotate(360deg)}}
.ring-p{position:absolute;top:50%;right:12vw;transform:translateY(-50%) rotateX(72deg);width:min(42vw,380px);height:min(42vw,380px);border-radius:50%;border:2px solid #ffffff1c}
@media(max-width:820px){.planet,.moon-m,.ring-p{display:none}}
.copy{position:absolute;left:8vw;top:50%;transform:translateY(-50%);max-width:520px;z-index:2}
.kick{font-size:11px;letter-spacing:.45em;color:#aab6ff;text-transform:uppercase;margin-bottom:2.4em}
h1{font-family:Syne;font-weight:800;font-size:clamp(3rem,6vw,5.6rem);line-height:1;letter-spacing:-.02em;color:#f4f6ff}
h1 em{color:#aab6ff}
p{margin-top:2.2em;font-weight:300;font-size:15px;line-height:2.05;color:#98a2cc;max-width:400px}
.go{margin-top:3em;display:inline-block;background:#aab6ff;color:#07080d;font-weight:700;padding:17px 46px;text-decoration:none;font-size:13px;border-radius:999px;transition:.25s}
.go:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 44px #aab6ff44}
</style></head><body>
<div class="ring-p"></div><div class="moon-m"></div><div class="planet"></div>
<div class="copy">
<div class="kick">Focus OS · one task in orbit, everything else parked</div>
<h1>Work in<br><em>quiet orbit.</em></h1>
<p>Your day has one center of gravity. Orbit Desk parks every other open loop at the edge of your screen and pulls forward only the task that matters now.</p>
<a class="go" href="#">Enter orbit →</a></div></body></html>
