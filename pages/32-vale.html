<!doctype html><html><head><meta charset="utf-8"><title>Vale</title>
<style>*{margin:0;box-sizing:border-box}body{height:100vh;overflow:hidden;background:#e8e2d6;color:#3a3628;font-family:sans-serif;display:flex}
.pal{flex:1.15;position:relative;background:#dcd4c2;overflow:hidden;display:flex;align-items:center;justify-content:center}
.strip{position:absolute;width:120%;height:19%;left:-10%;display:flex;transition:.5s cubic-bezier(.2,.9,.3,1);cursor:pointer}
.st1{top:0;background:#7d8471;transform:rotate(-3deg) translateY(6%)}.st1:hover{transform:rotate(-1deg)}

.st4{top:72%;background:#9c8860}.st4:hover{transform:translateX(5%)}
.strip span{align-self:center;margin-left:12vw;font-size:11px;letter-spacing:.35em;color:#ffffffcc;text-transform:uppercase}
.copy{width:44%;min-width:340px;padding:12vh 6vw;display:flex;flex-direction:column;justify-content:center}
.kick{font-size:11px;letter-spacing:.42em;color:#8a7346;text-transform:uppercase;margin-bottom:2.6em}
h1{font-weight:250;font-size:clamp(2.6rem,4.4vw,4.3rem);line-height:1.06;color:#33301f}
p{margin-top:2em;max-width:380px;font-weight:300;font-size:14.5px;line-height:2;color:#6e6852}
.swatches{display:flex;gap:14px;margin-top:3em}
.s{width:52px;height:52px;border-radius:50%;box-shadow:inset 0 -8px 14px #00000022,0 4px 12px #00000018;transition:.25s;cursor:pointer}
.s:hover{transform:scale(1.16) translateY(-4px)}
.order{margin-top:3em;width:fit-content;background:#33301f;color:#e8e2d6;padding:17px 44px;text-decoration:none;font-size:13px;letter-spacing:.16em;border-radius:2px;transition:.25s}
.order:hover{background:#8a7346}
</style></head><body>
