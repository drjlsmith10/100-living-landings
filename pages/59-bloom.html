<!doctype html><html><head><meta charset="utf-8"><title>Bloom</title>
<style>*{margin:0;box-sizing:border-box}body{background:#0d1f1a;color:#e6f2ea;font-family:sans-serif;height:100vh;overflow:hidden;display:flex;align-items:center;padding:0 7vw}
.wrap{display:flex;width:100%;gap:min(6vw,80px);align-items:center}
@media(max-width:840px){.wrap{flex-direction:column-reverse}.flower-viz{width:min(60vw,280px)!important}}
.copy{flex:1;max-width:520px}
.kick{font-size:11px;letter-spacing:.42em;color:#7ed9a3;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:300;font-size:clamp(2.7rem,4.8vw,4.6rem);line-height:1.06}
h1 b{color:#7ed9a3;font-weight:600}
p{margin-top:2em;font-weight:300;font-size:14.5px;line-height:2;color:#93b5a2;max-width:400px}
.go{margin-top:2.8em;display:inline-block;background:#7ed9a3;color:#0d1f1a;font-weight:700;padding:16px 42px;border-radius:999px;text-decoration:none;font-size:13px;transition:.25s}
.go:hover{transform:translateY(-3px);box-shadow:0 14px 44px #7ed9a344}
.flower-viz{width:min(36vw,300px);position:relative;text-align:center}
svg{width:100%;transform:rotate(-90deg)}
.seg{fill:none;stroke-width:26;stroke-linecap:round}
.s1{stroke:#7ed9a3}.s2{stroke:#e0c94a}.s3{stroke:#e07b8a}.s4{stroke:#6ba8d9}
.center-b{margin-top:-58%}
.legend{display:flex;justify-content:center;gap:18px;margin-top:24px;font-size:11.5px;color:#93b5a2;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style></head><body>
<div class="wrap">
<div class="copy">
<div class="kick">See the shape of your business</div>
<h1>Four numbers,<br>one <b>living picture.</b></h1>
<p>Revenue, retention, runway, and team health — drawn as a single bloom that opens when things grow and closes when they don't. Glanceable from across the room.</p>
<a class="go" href="#">GROW YOURS — FREE FOR 30 DAYS →</a></div>
<div class="flower-viz">
<svg viewBox="0 0 200 200"><circle class="seg s1" cx="100" cy="100" r="80" stroke-dasharray="377" stroke-dashoffset="94"/><circle class="seg s2" cx="100" cy="100" r="56" stroke-dasharray="264" stroke-dashoffset="66"/><circle class="seg s3" cx="100" cy="100" r="32" stroke-dasharray="151" stroke-dashoffset="38"/></svg>
<div class="center-b"><div style="width:52px;height:52px;background:#e6f2ea;border-radius:50%;margin:0 auto"></div></div>
<div class="legend"><span><i style="background:#7ed9a3"></i>Revenue 75%</span><span><i style="background:#e0c94a"></i>Retention 75%</span><span><i style="background:#e07b8a"></i>Runway 75%</span></div></div></div></body></html>
