<!doctype html><html><head><meta charset="utf-8"><title>Soft Signal</title>
<style>*{margin:0;box-sizing:border-box}body{height:100vh;overflow:hidden;background:#131318;color:#e8e4dc;display:flex;align-items:center;font-family:sans-serif}
.vinyl{position:relative;width:min(72vw,480px);height:100vh;flex-shrink:0}
.disc{position:absolute;top:50%;left:60%;transform:translate(-50%,-50%);width:min(80vw,520px);height:min(80vw,520px);border-radius:50%;background:repeating-radial-gradient(circle,#17171d 0 2.5px,#101015 2.5px 6px);animation:spin 5s linear infinite;box-shadow:0 0 90px #000000aa}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.label{position:absolute;inset:31%;border-radius:50%;background:radial-gradient(#f26daa,#7c3aed);display:flex;align-items:center;justify-content:center}
.label::after{content:"";width:11%;aspect-ratio:1;background:#131318;border-radius:50%}
.copy{padding:0 7vw 0 0;max-width:520px;z-index:2;position:relative}
.kicker{font-size:11px;letter-spacing:.45em;color:#f26daa;text-transform:uppercase;margin-bottom:2em}
h1{font-weight:200;font-size:clamp(2.6rem,5.5vw,4.6rem);line-height:1.05;letter-spacing:-.02em}
h1 b{color:#b9a8ff}
p{margin-top:1.8em;font-size:14px;line-height:1.95;font-weight:300;color:#a49e93;max-width:380px}
.eq{display:flex;gap:5px;align-items:flex-end;height:34px;margin-top:2.6em}
.eq i{width:5px;background:#f26daa;border-radius:3px;animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(1){height:30%}.eq i:nth-child(2){height:80%;animation-delay:.12s}.eq i:nth-child(3){height:50%;animation-delay:.24s}.eq i:nth-child(4){height:95%;animation-delay:.36s}.eq i:nth-child(5){height:40%;animation-delay:.48s}.eq i:nth-child(6){height:70%;animation-delay:.6s}
@keyframes eq{to{transform:scaleY(.25)}}
.listen{display:inline-block;margin-top:2.4em;color:#131318;background:#e8e4dc;padding:15px 36px;border-radius:999px;text-decoration:none;font-size:12px;letter-spacing:.28em;transition:.3s}
.listen:hover{background:#f26daa;color:#fff}
</style></head><body>
<div class="vinyl"><div class="disc"><div class="label"></div></div></div>
<div class="copy">
<div class="kicker">Independent · Ambient · Late night</div>
<h1>Music for<br>the hour <b>nobody</b><br>else is awake.</h1>
<p>Soft Signal is a small label pressing ambient and downtempo records in runs of 300. No streaming exclusives, no playlists — just vinyl you put on when the house finally goes quiet.</p>
<div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i></div><br>
<a class="listen" href="#">LISTEN TO SIDE A</a></div></body></html>
