<!doctype html><html><head><meta charset="utf-8"><title>Morrow Coffee — First Light</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,900;1,300&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{height:100vh;overflow:hidden;background:linear-gradient(#2b1b4d,#6b3069 40%,#c85a54 65%,#f0975a 82%,#ffd39a);font-family:Fraunces,serif;position:relative;color:#fff4e6}
.sun-m{position:absolute;left:50%;bottom:24vh;width:24vmin;height:24vmin;margin-left:-12vmin;border-radius:50%;background:radial-gradient(#fff6da,#ffce7e 58%,#ff9950);box-shadow:0 0 100px 44px #ffab5e59;animation:sunup 13s ease-in-out infinite alternate}
@keyframes sunup{from{transform:translateY(15vh) scale(.78)}to{transform:translateY(-5vh) scale(1)}}
.ridge-r{position:absolute;border-radius:50% 50% 0 0}
.rf{bottom:-8vh;left:-30%;width:160%;height:32vh;background:#381d3d}.rn{bottom:-11vh;left:-10%;width:130%;height:34vh;background:#241229}
.birds-b i{position:absolute;width:14px;height:7px;border-top:3px solid #2a1435;border-radius:60% 60% 0 0;top:16vh;left:-20px;animation:flyM 17s linear infinite}.birds-b i::before{content:"";position:absolute;left:11px;top:-3px;width:14px;height:7px;border-top:3px solid #2a1435;border-radius:60% 60% 0 0}
.birds-b i:nth-child(1){animation-delay:0s}.birds-b i:nth-child(2){top:21vh;animation-delay:6s;transform:scale(.7)}.birds-b i:nth-child(3){top:13vh;animation-delay:11s;transform:scale(.55)}
@keyframes flyM{to{left:105vw}}
.cup-sil{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(56vw,300px)}
.cbody{background:#17091d;height:30vh;border-radius:16px 16px 54px 54px/10px 10px 80px 80px;box-shadow:inset -2.4vmin -1vmin 0 #00000066,inset 1.8vmin .9vmin 0 #ffffff12}
.chandle{position:absolute;right:-8vmin;top:2vh;width:10vmin;height:12vmin;border:2.4vmin solid #17091c;border-left:none;border-radius:0 5vmin 5vmin 0}
.steam-s i{position:absolute;bottom:calc(30vh + 2vmin);left:50%;width:2.2vmin;height:13vmin;margin-left:-1.1vmin;border-radius:50%;background:linear-gradient(#ffe4c199,transparent);filter:blur(.6vmin);animation:riseS 6s ease-in-out infinite}
.steam-s i:nth-child(2){margin-left:-4.6vmin;animation-delay:2s}.steam-s i:nth-child(3){margin-left:2.4vmin;animation-delay:4s}
@keyframes riseS{0%{transform:translateY(2vmin) skewX(0);opacity:0}25%{opacity:.85}100%{transform:translateY(-16vmin) translateX(3vmin) skewX(-14deg);opacity:0}}
.wordmark{position:absolute;top:8vh;width:100%;text-align:center;z-index:2}
.wordmark small{letter-spacing:.55em;font-size:11px;color:#ffd9a8;text-transform:uppercase;font-family:sans-serif}
.wordmark h1{font-weight:900;font-style:italic;font-size:clamp(2.8rem,7vw,5.2rem);line-height:1;margin-top:.25em;text-shadow:0 4px 30px #00000055}
.shoplink{position:absolute;bottom:5vh;width:100%;text-align:center;z-index:2}
.shoplink a{color:#2b1b4d;background:#ffd9a8;padding:15px 42px;border-radius:999px;text-decoration:none;font-size:12px;letter-spacing:.35em;font-family:sans-serif;transition:.3s}
.shoplink a:hover{transform:translateY(-4px);box-shadow:0 14px 34px #00000044}
</style></head><body>
<div class="sun-m"></div><div class="ridge-r rf"></div><div class="ridge-r rn"></div>
<div class="birds-b"><i></i><i></i><i></i></div>
<div class="wordmark"><small>roasted for slow mornings</small><h1>Morrow</h1></div>
<div class="cup-sil"><div class="steam-s"><i></i><i></i><i></i></div><div class="cbody"></div><div class="chandle"></div></div>
<div class="shoplink"><a href="#">SHOP THE ROAST</a></div></body></html>
