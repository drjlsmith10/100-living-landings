<!doctype html><html><head><meta charset="utf-8"><title>Loop</title>
<style>*{margin:0;box-sizing:border-box}body{background:#14121f;color:#ece9f5;font-family:sans-serif;height:100vh;overflow:hidden;display:flex;align-items:center;padding:0 7vw}
.wrap{display:flex;width:100%;gap:min(6vw,70px);align-items:center}
@media(max-width:820px){.viz2{display:none}}
.copy{max-width:520px;flex:1}
.kick{font-size:11px;letter-spacing:.42em;color:#a78bfa;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:300;font-size:clamp(2.7rem,5vw,4.8rem);line-height:1.05}
h1 b{color:#a78bfa;font-weight:600}
p{margin-top:2em;font-weight:300;font-size:14.5px;line-height:2;color:#a29cb8;max-width:400px}
.streaks{display:flex;gap:10px;margin-top:2.6em}
.d{width:34px;height:34px;border-radius:9px;background:#241f38;display:flex;align-items:center;justify-content:center;font-size:14px;animation:flipD .5s both}
.d.on{background:#a78bfa;color:#14121f}
@keyframes flipD{from{transform:rotateY(90deg)}}
.d:nth-child(1){animation-delay:.1s}.d:nth-child(2){animation-delay:.2s}.d:nth-child(3){animation-delay:.3s}.d:nth-child(4){animation-delay:.4s}.d:nth-child(5){animation-delay:.5s}.d:nth-child(6){animation-delay:.6s}.d:nth-child(7){animation-delay:.7s}
.missed-note{margin-top:1.6em;font-size:12px;color:#7a7394}
.go{margin-top:2.6em;display:inline-block;background:#a78bfa;color:#14121f;font-weight:700;padding:17px 42px;border-radius:999px;text-decoration:none;font-size:13px;transition:.25s}
.go:hover{box-shadow:0 0 44px #a78bfa55;transform:translateY(-2px)}
.viz2{width:min(36vw,360px)}
.ring-big{position:relative;width:100%;aspect-ratio:1}
svg{width:100%;height:100%;transform:rotate(-90deg)}
.bg-ring{fill:none;stroke:#241f38;stroke-width:13}
.fg-ring{fill:none;stroke:#a78bfa;stroke-width:13;stroke-linecap:round;stroke-dasharray:785;stroke-dashoffset:785;animation:ringfill 2s cubic-bezier(.2,.8,.2,1) forwards .4s}
@keyframes ringfill{to{stroke-dashoffset:157}}
.center-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.center-txt b{font-size:52px;font-weight:200}
.center-txt span{font-size:11px;letter-spacing:.3em;color:#7a7394;margin-top:6px}
</style></head><body>
<div class="wrap">
<div class="copy">
<div class="kick">The habit tracker with no guilt</div>
<h1>Miss a day.<br><b>Keep the streak.</b></h1>
<p>Loop counts your weekly average, not your perfect record. Life happens on Tuesdays sometimes — your habits shouldn't die because of it.</p>
<div class="streaks"><span class="d on">✓</span><span class="d on">✓</span><span class="d">·</span><span class="d on">✓</span><span class="d on">✓</span><span class="d on">✓</span><span class="d on">✓</span></div>
<div class="missed-note">Wednesday happened. Streak intact.</div>
<a class="go" href="#">START ONE LOOP — FREE</a></div>
<div class="viz2"><div class="ring-big">
<svg viewBox="0 0 280 280"><circle class="bg-ring" cx="140" cy="140" r="125"/><circle class="fg-ring" cx="140" cy="140" r="125"/></svg>
<div class="center-txt"><b>80%</b><span>WEEKLY AVERAGE<br>= STREAK ALIVE</span></div></div></div></div></body></html>
