<!doctype html><html><head><meta charset="utf-8"><title>Morrow Coffee</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,900;1,400&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{height:100vh;overflow:hidden;font-family:Fraunces,serif;background:linear-gradient(#241b3a,#5d2f52 45%,#b8524f 72%,#eda15c);color:#fff4e6;position:relative}
.sun{position:absolute;left:50%;bottom:18vh;width:26vmin;height:26vmin;margin-left:-13vmin;border-radius:50%;background:radial-gradient(#fff3cf,#ffb45e 65%,#ff8f47);box-shadow:0 0 12vmin 4vmin #ffab5577;animation:dawn 14s ease-in-out infinite alternate}
@keyframes dawn{from{transform:translateY(16vh) scale(.75)}to{transform:translateY(-6vh) scale(1)}}
.ridge{position:absolute;bottom:-12vh;left:-10%;width:130%;height:36vh;border-radius:50% 50% 0 0/100% 100% 0 0;background:#33203f}.ridge.far{left:-30%;height:30vh;background:#4b2b4d;bottom:-8vh}
.cup{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(64vw,340px)}
.cup .body{background:#16091c;height:34vh;border-radius:18px 18px 60px 60px/12px 12px 90px 90px;box-shadow:inset -3vmin -1vmin 0 #00000066,inset 2vmin 1vmin 0 #ffffff14}
.cup .handle{position:absolute;right:-9vmin;top:2vh;width:11vmin;height:13vmin;border:2.6vmin solid #16091c;border-left:none;border-radius:0 5vmin 5vmin 0}
.steam i{position:absolute;bottom:calc(34vh + 2vmin);left:50%;width:2.4vmin;height:14vmin;margin-left:-1.2vmin;border-radius:50%;background:linear-gradient(#ffe4c199,transparent);filter:blur(.7vmin);animation:rise 6s ease-in-out infinite}
.steam i:nth-child(2){margin-left:-5vmin;animation-delay:2s}.steam i:nth-child(3){margin-left:2.6vmin;animation-delay:4s}
@keyframes rise{0%{transform:translateY(2vmin) skewX(0);opacity:0}25%{opacity:.9}100%{transform:translateY(-17vmin) translateX(3vmin) skewX(-14deg);opacity:0}}
.word{position:absolute;top:9vh;width:100%;text-align:center}
.word small{letter-spacing:.55em;font-size:11px;text-transform:uppercase;color:#ffd9a8}
.word h1{font-weight:900;font-style:italic;font-size:clamp(2.6rem,7vw,5rem);line-height:1;margin-top:.3em;text-shadow:0 4px 30px #00000055}
.word p{font-family:sans-serif;font-weight:300;font-size:13px;opacity:.85;margin-top:1em;letter-spacing:.08em}
.shop{position:absolute;bottom:5vh;width:100%;text-align:center}
.shop a{color:#241b3a;background:#ffd9a8;padding:15px 42px;border-radius:999px;text-decoration:none;font-size:12px;letter-spacing:.35em;transition:.3s}
.shop a:hover{transform:translateY(-4px);box-shadow:0 14px 34px #00000044}
</style></head><body>
<div class="sun"></div><div class="ridge far"></div><div class="ridge"></div>
<div class="word"><small>roasted for slow mornings</small><h1>Morrow</h1><p>SMALL-BATCH COFFEE · SHIPS MONDAYS</p></div>
<div class="cup"><div class="steam"><i></i><i></i><i></i></div><div class="body"></div><div class="handle"></div></div>
<div class="shop"><a href="#">SHOP THE ROAST</a></div></body></html>
