<!doctype html><html><head><meta charset="utf-8"><title>Kite</title>
<style>*{margin:0;box-sizing:border-box}body{background:#8ecae6;color:#023047;font-family:sans-serif;height:100vh;overflow:hidden;position:relative}
.sky{position:absolute;inset:0;background:linear-gradient(#8ecae6,#c8e6f5 70%,#e8f4fa)}
.kite-svg{position:absolute;top:12%;right:14%;width:min(30vw,220px);animation:flyK 6s ease-in-out infinite alternate}
@keyframes flyK{from{transform:translate(0,0) rotate(-4deg)}to{transform:translate(-24px,18px) rotate(5deg)}}
.string{position:absolute;top:calc(12% + min(22vw,160px));right:calc(14% + 10px);width:2px;height:60vh;background:linear-gradient(#02304766,#02304711);transform-origin:top;animation:strswayK 6s ease-in-out infinite alternate}
.copy{position:absolute;left:7vw;top:50%;transform:translateY(-50%);max-width:480px;z-index:2}
.kick{font-size:11px;letter-spacing:.42em;color:#fb8500;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:300;font-size:clamp(2.8rem,5.4vw,5rem);line-height:1.05;color:#023047}
h1 b{color:#fb8500;font-weight:700}
p{margin-top:2em;font-weight:300;font-size:15px;line-height:2;color:#33556b;max-width:400px}
.go{margin-top:2.8em;display:inline-block;background:#023047;color:#fff;font-weight:600;padding:17px 44px;border-radius:999px;text-decoration:none;font-size:13px;transition:.25s}
.go:hover{background:#fb8500;transform:translateY(-4px) rotate(-1deg)}
.cloud{position:absolute;width:130px;height:40px;border-radius:999px;background:#ffffffcc;animation:cloudC 26s linear infinite}
.c1{bottom:20%;left:-140px}.c2{bottom:34%;left:-260px;width:90px;animation-delay:-13s;animation-duration:34s}
@keyframes cloudC{to{left:110%}}
</style></head><body>
<div class="sky"></div>
<div class="cloud c1"></div><div class="cloud c2"></div>
<svg class="kite-svg" viewBox="0 0 120 150"><polygon points="60,5 112,62 60,120 8,62" fill="#fb8500" stroke="#023047" stroke-width="4"/><line x1="60" y1="5" x2="60" y2="120" stroke="#023047" stroke-width="3"/><line x1="8" y1="62" x2="112" y2="62" stroke="#023047" stroke-width="3"/><path d="M60,124 q-14,16 4,28 q16,12 2,26" fill="none" stroke="#d62828" stroke-width="4"/></svg>
<div class="string"></div>
<div class="copy">
<div class="kick">Playful tools for serious creators</div>
<h1>Serious work<br>needs a <b>little wind.</b></h1>
<p>Kite makes small, joyful tools that take the tedium out of creative work — so the boring parts fly by and you stay in flow.</p>
<a class="go" href="#">Catch the wind →</a></div></body></html>
