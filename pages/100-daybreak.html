<!doctype html><html><head><meta charset="utf-8"><title>Daybreak</title>
<style>*{margin:0;box-sizing:border-box}body{height:100vh;overflow:hidden;background:#141020;color:#f2ede4;font-family:sans-serif;position:relative}
.stars i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.6;animation:twk 4s infinite}
@keyframes twk{50%{opacity:.1}}
.horizon{position:absolute;bottom:0;width:100%;height:44%;background:linear-gradient(#241a3e,#0e0a18);clip-path:polygon(0 34%,14% 22%,30% 30%,47% 12%,64% 26%,80% 16%,100% 28%,100% 100%,0 100%)}
.sunrise{position:absolute;bottom:18%;left:50%;width:130px;height:130px;margin-left:-65px;border-radius:50%;background:radial-gradient(#fff3cf,#ffc36b 62%,#ff9d4d);box-shadow:0 0 100px 40px #ffab5e55;animation:firstlight 10s ease-in-out infinite alternate}
@keyframes firstlight{from{transform:translateY(90px) scale(.8)}to{transform:translateY(0) scale(1)}}
.copy{position:relative;z-index:2;padding:15vh 8vw 0;max-width:640px}
.kick{font-size:11px;letter-spacing:.45em;color:#ffbe7a;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:250;font-size:clamp(2.9rem,6vw,5.5rem);line-height:1.03;letter-spacing:-.02em}
h1 b{color:#ffbe7a;font-weight:600}
p{margin-top:2.1em;max-width:430px;font-weight:300;font-size:14.5px;line-height:2;color:#b8adcc}
.go{margin-top:3em;display:inline-block;background:#ffbe7a;color:#141020;font-weight:700;padding:17px 46px;border-radius:999px;text-decoration:none;font-size:13px;transition:.25s}
.go:hover{transform:translateY(-3px);box-shadow:0 0 50px #ffbe7a55}
</style></head><body>

<div class="sunrise"></div><div class="horizon"></div>
<div class="copy">
