<!doctype html><html><head><meta charset="utf-8"><title>Current</title>
<style>*{margin:0;box-sizing:border-box}body{background:#0b1626;color:#e2ecf4;font-family:sans-serif;height:100vh;overflow:hidden;display:flex}
.river{flex:1.1;position:relative;background:linear-gradient(#0e1e30,#132a40);overflow:hidden}
.streamline{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#5cb8d488,transparent);animation:flowR 3.4s linear infinite;transform-origin:left center}
.s1{top:20%;left:-25%;width:55%;animation-duration:3s}.s2{top:38%;left:-15%;width:45%;animation-delay:.9s}.s3{top:56%;left:-30%;width:60%;animation-delay:1.7s;animation-duration:4s}.s4{top:74%;left:-10%;width:50%;animation-delay:2.3s}.s5{top:88%;left:-28%;width:58%;animation-delay:.4s}
@keyframes flowR{from{transform:translateX(0) rotate(-1deg)}to{transform:translateX(300vw) rotate(1deg)}}
@media(max-width:800px){.river{display:none}}
.copy{width:min(54%,600px);padding:11vh max(6vw,50px);display:flex;flex-direction:column;justify-content:center;background:#0b1626;z-index:1}
.kick{font-size:11px;letter-spacing:.42em;color:#5cb8d4;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:250;font-size:clamp(2.8rem,5vw,4.8rem);line-height:1.05;color:#f0f7fa}
h1 b{color:#5cb8d4;font-weight:700}
p{margin-top:2em;font-weight:300;font-size:15px;line-height:2.05;color:#93aabb;max-width:420px}
.stat-row{display:flex;gap:34px;margin-top:2.8em}
.st b{display:block;font-size:29px;color:#5cb8d4;font-weight:300}
.st span{font-size:11px;letter-spacing:.18em;color:#6b8598;text-transform:uppercase}
.go{margin-top:2.8em;width:fit-content;background:#5cb8d4;color:#0b1626;font-weight:700;padding:16px 44px;text-decoration:none;font-size:13px;border-radius:999px;transition:.25s;display:inline-block;margin-right:14px}
.go:hover{transform:translateY(-3px);box-shadow:0 14px 44px #5cb8d444}
</style></head><body>
<div class="river"><div class="streamline s1"></div><div class="streamline s2"></div><div class="streamline s3"></div><div class="streamline s4"></div><div class="streamline s5"></div></div>
<div class="copy">
<div class="kick">Current · cash flow you can understand</div>
<h1>Know your runway<br>in <b>one glance.</b></h1>
<p>Current reads your accounts nightly and answers the only question that matters this month: how long until the money runs out — and what moves it.</p>
<div class="stat-row"><div class="st"><b>14 mo</b><span>runway today</span></div><div class="st"><b>+2 mo</b><span>if you cut tooling</span></div></div>
<a class="go" href="#">See your current →</a></div></body></html>
