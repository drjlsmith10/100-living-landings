<!doctype html><html><head><meta charset="utf-8"><title>Orbit Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{background:#05060a;color:#e8ecff;font-family:Unbounded,sans-serif;height:100vh;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.15}}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 9vw;z-index:2}
.tag{font-size:11px;letter-spacing:.5em;color:#7c8cff;text-transform:uppercase}
h1{font-weight:300;font-size:clamp(3rem,7vw,6rem);line-height:1.05;margin:.4em 0}
h1 b{font-weight:700;color:#aab6ff}
p{max-width:420px;font-size:14px;line-height:1.9;color:#9aa2c7;font-family:sans-serif}
a{margin-top:2.4em;display:inline-block;width:fit-content;color:#05060a;background:#aab6ff;padding:16px 38px;border-radius:999px;text-decoration:none;font-size:12px;letter-spacing:.2em;transition:.3s}
a:hover{box-shadow:0 0 40px #7c8cff88;transform:scale(1.05)}
.orbit{position:absolute;right:-12vw;top:50%;width:56vw;height:56vw;transform:translateY(-50%);border:1px solid #ffffff14;border-radius:50%;animation:spin 40s linear infinite}
.orbit::before,.orbit::after{content:"";position:absolute;border-radius:50%;background:#aab6ff}
.orbit::before{top:-5px;left:50%;width:10px;height:10px;box-shadow:0 0 18px #aab6ff}
.orbit::after{inset:18%;border:1px dashed #ffffff22;background:none}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
</style></head><body>
<div class="orbit"></div><div class="star" style="top:12%;left:20%"></div><div class="star" style="top:70%;left:8%;animation-delay:1s"></div><div class="star" style="top:30%;left:80%;animation-delay:2s"></div><div class="star" style="top:85%;left:60%;animation-delay:.5s"></div>
<div class="wrap"><div class="tag">Focus OS · v3</div><h1>Work in<br><b>quiet orbit.</b></h1><p>One task at center stage. Everything else drifts to the edge until you're ready. Orbit Desk is the anti-tab, the calm command deck for people drowning in open loops.</p><a href="#">ENTER ORBIT →</a></div></body></html>
