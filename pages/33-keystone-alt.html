<!doctype html><html><head><meta charset="utf-8"><title>Keystone Works</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@200;800&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{background:#1a2634;color:#e8eef4;font-family:'Libre Franklin',sans-serif;height:100vh;overflow:hidden;display:flex}
.arch-viz{flex:1.1;position:relative;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#1f2d3d,#16222e);padding-bottom:10vh}
.arch-a{position:relative;width:min(50vw,300px);height:min(56vh,360px)}
.stone{position:absolute;background:#31465c;transition:.25s;cursor:pointer}
.stone:hover{background:#4dc9b0;transform:scale(1.05)}
.s-keystone{top:-24px;left:calc(50% - 34px);width:68px;height:52px;background:#4dc9b0;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);z-index:2;animation:dropKs 1s cubic-bezier(.2,.9,.3,1.35) both .5s}
.s-left{left:0;bottom:0;width:44%;height:78%;border-radius:170px 0 0 0}.s-left::after{content:"";position:absolute;top:56%;right:-2px;width:12px;height:12px;background:#16222e;border-radius:50%}
.s-right{right:0;bottom:0;width:44%;height:78%;border-radius:0 170px 0 0}
@keyframes dropKs{from{transform:translateY(-140px) rotate(-20deg);opacity:0}}
@media(max-width:780px){.arch-viz{display:none}}
.copy{width:min(54%,620px);padding:11vh max(6vw,50px);display:flex;flex-direction:column;justify-content:center;background:#1a2634;z-index:1}
.kick{font-size:11px;letter-spacing:.42em;color:#4dc9b0;text-transform:uppercase;margin-bottom:2.4em}
h1{font-weight:200;font-size:clamp(2.8rem,5vw,4.9rem);line-height:1.05;color:#f0f6fa}
h1 b{color:#4dc9b0;font-weight:800}
p{margin-top:2em;font-weight:300;font-size:15px;line-height:2.05;color:#93aab8;max-width:420px}
.go{margin-top:2.8em;width:fit-content;background:#4dc9b0;color:#16222e;font-weight:700;padding:16px 44px;text-decoration:none;font-size:13px;border-radius:999px;transition:.25s;display:inline-block;margin-right:14px}
.go:hover{transform:translateY(-3px);box-shadow:0 14px 44px #4dc9b044}
</style></head><body>
<div class="arch-viz"><div class="arch-a"><div class="stone s-left"></div><div class="stone s-right"></div><div class="stone s-keystone"></div></div></div>
<div class="copy">
<div class="kick">Keystone Works · fractional COO for the messy middle</div>
<h1>Your company has<br>a <b>missing piece.</b><br>I'm it.</h1>
<p>Series A chaos, ops debt, no time to hire a full COO — I slot into your leadership team two days a week and build the machine while you run the business.</p>
<a class="go" href="#">See how engagements work →</a></div></body></html>
