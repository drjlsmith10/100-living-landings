<!doctype html><html><head><meta charset="utf-8"><title>Signal Fire</title>
<style>*{margin:0;box-sizing:border-box}body{background:#12100c;color:#f0e8d8;font-family:sans-serif;height:100vh;overflow:hidden;position:relative}
.darkness{position:absolute;inset:0;background:radial-gradient(circle at 50% 72%,transparent 0,#000 68%)}
.firepit{position:absolute;bottom:16vh;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:7px}
.flame{width:20px;background:linear-gradient(#ffe9a8,#ff9d3c 55%,#d43e12);border-radius:50% 50% 30% 30%;transform-origin:bottom;animation:flickF .8s ease-in-out infinite alternate}
.f1{height:64px}.f2{height:96px;animation-delay:.15s}.f3{height:78px;animation-delay:.28s}.f4{height:52px;animation-delay:.42s}.f5{height:88px;animation-delay:.1s}.f6{height:60px;animation-delay:.35s}
@keyframes flickF{to{transform:scaleY(1.25) skewX(4deg)}}
.logs{position:absolute;bottom:12vh;left:50%;transform:translateX(-50%) rotate(4deg);width:190px;height:14px;background:#4a2c14;border-radius:7px;box-shadow:0 22px 0 #3a2210,0 -10px 0 #4a2c1455}
.embers i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffcf7a;animation:riseE 3s ease-out infinite}
.embers i:nth-child(1){left:47%;animation-delay:.2s}.embers i:nth-child(2){left:52%;animation-delay:1.1s}.embers i:nth-child(3){left:49%;animation-delay:1.9s}.embers i:nth-child(4){left:54%;animation-delay:.6s}
@keyframes riseE{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26vh) translateX(40px)}}
.copy{position:absolute;top:11vh;left:0;width:100%;text-align:center;z-index:2}
.kick{font-size:11px;letter-spacing:.5em;color:#ffab4a;text-transform:uppercase;margin-bottom:2em}
h1{font-weight:250;font-size:clamp(2.6rem,5.4vw,4.7rem);line-height:1.08;text-shadow:0 4px 40px #000}
p{max-width:420px;margin:2.4vh auto 0;font-weight:300;font-size:14px;line-height:2;color:#cbbfa8}
.go{margin-top:3vh;display:inline-block;border:1px solid #ffab4a;color:#ffab4a;padding:15px 40px;text-decoration:none;font-size:12px;letter-spacing:.28em;text-transform:uppercase;transition:.3s;border-radius:2px}
.go:hover{background:#ffab4a;color:#12100c}
</style></head><body>
<div class="darkness"></div>
<div class="firepit"><div class="flame f1"></div><div class="flame f2"></div><div class="flame f3"></div><div class="flame f4"></div><div class="flame f5"></div><div class="flame f6"></div></div>
<div class="logs"></div><div class="embers"><i></i><i></i><i></i><i></i></div>
<div class="copy">
<div class="kick">Research → decisions, while it's still hot</div>
<h1>Stop hoarding<br>insights by <b>candlelight.</b></h1>
<p>Signal Fire turns scattered research — PDFs, calls, competitor moves — into a weekly decision brief your leadership actually acts on.</p>
<a class="go" href="#">Light the first fire</a></div></body></html>
