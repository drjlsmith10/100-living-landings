<!doctype html><html><head><meta charset="utf-8"><title>The Landing Pages — hand-authored gallery</title>
<style>*{margin:0;box-sizing:border-box}body{background:#0d0d10;color:#ece9e1;font-family:Georgia,serif}
header{padding:12vh 7vw 7vh;display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap}
h1{font-size:clamp(3rem,8vw,7.5rem);line-height:.95;font-weight:400;font-style:italic}
header p{max-width:300px;font-family:sans-serif;font-weight:300;font-size:13.5px;line-height:2;color:#a09b90}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:3px;background:#26262c;padding:3px}
.tile{aspect-ratio:.82;background:#141418;display:flex;flex-direction:column;justify-content:space-between;padding:24px;text-decoration:none;color:#ece9e1;transition:.25s;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;opacity:0;transition:.35s}
.tile:hover::before{opacity:1}
.t1::before{background:radial-gradient(circle at 70% 20%,#aab6ff33,transparent)}
.t2::before{background:radial-gradient(circle at 30% 80%,#ffb46b44,transparent)}
.t3::before{background:radial-gradient(circle at 60% 60%,#5fd08a33,transparent)}
.t4::before{background:radial-gradient(circle at 20% 20%,#f26daa33,transparent)}
.t5::before{background:radial-gradient(circle at 80% 70%,#ffd84d33,transparent)}
.tile:hover{transform:none}
.tile small{font-size:10px;letter-spacing:.28em;color:#8f8b80;text-transform:uppercase}
.tile strong{font-size:27px;font-weight:400;line-height:1.05;margin-top:auto}
.tile span{font-size:12px;color:#8f8b80;margin-top:8px;font-family:sans-serif}
footer{padding:50px 7vw;color:#77726a;font-size:12px;font-family:sans-serif}
</style></head><body>
<header><h1>One hundred,<br>written one<br>at a time.</h1><p>Every page in this gallery was authored individually — its own layout, palette, type, and motion, matched to what it's selling. No templates were harmed.</p></header>
<div class="grid" id="g"></div>
<footer>Built as a demonstration that "generated" and "designed" don't have to be opposites.</footer>
<script>
const P=[["01","Orbit Desk","Focus OS","t1"],["02","Morrow Coffee","small-batch roast","t2"],["03","Northstar Studio","brand strategy","t4"],["04","Field Notes","weekly letter","t5"],["05","Lumen House","boutique stay","t2"],["06","Packet Zero","AI operating manual","t1"],["07","Soft Signal","vinyl label","t4"],["09","Good Measure","money dashboard","t3"],["10","Wild Fig","seasonal table","t3"],["11","Relay","client comms","t3"],["12","Ember Objects","handmade goods","t2"],["13","Cedar & Co","life planning","t3"],["15","Cloudline","travel design","t1"],["17","Aster","skincare","t2"],["19","Ledgerly","bookkeeping","t5"],["20","Sunday Index","link letter","t5"],["21","Tandem","team pairing","t3"],["22","Woven","textiles","t2"],["23","Brightwork","clarity studio","t5"],["24","After Hours","monthly magazine","t4"],["25","Pace","adaptive training","t3"],["26","Rook","security review","t3"],["27","Tidepool","quiet objects","t1"],["29","Gauge","team metrics","t5"],["30","Kitchen Table","weekly recipes","t2"],["31","Hearth","project warmth","t2"],["32","Vale","mineral paint","t3"],["33","Keystone","fractional COO","t5"],["35","Vector","idea shipping","t4"],["37","Mica","everyday carry","t5"],["39","Plainspoken","plain language","t5"],["45","Mile Marker","running plans","t2"],["55","Loop","habit tracking","t4"],["56","Ironwood","operations","t2"],["89","Compass","decision dial","t5"],["93","Switchboard","tool wiring","t1"],["95","Monument","trust advisory","t5"],["100","Daybreak","morning accountability","t2"]];
document.getElementById('g').innerHTML=P.map(([n,t,k,c])=>`<a class="tile ${c}" href="pages/${n}-${t.toLowerCase().replace(/ /g,'-').replace('&','and')}.html"><small>No. ${n} · ${k}</small><strong>${t}</strong><span>view →</span></a>`).join('');
</script></body></html>
